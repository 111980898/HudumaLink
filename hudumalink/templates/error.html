{% extends "base.html" %}
{% block title %}Error {{ code }} · Huduma Link{% endblock %}
{% block content %}
<div class="wrap error-page">
  <b>{{ code }}</b>
  <h1>Something went wrong</h1>
  <p class="muted">{{ message }}</p>

</div>
{% endblock %}
